<div class="container">

  <app-office-form (officeCreated)="loadOffices()" />

  <h2 class="my-4">Nos espaces de coworking</h2>

  <div class="row g-4">

    @for (office of offices(); track office.id) {

      <div class="col-6">

        <div
          class="card h-100 shadow-sm position-relative"
          [routerLink]="['/offices', office.id]"
          style="cursor: pointer;"
        >

          <button
            type="button"
            class="btn-close position-absolute top-0 end-0 m-3"
            aria-label="Supprimer cet office"
            title="Supprimer"
            (click)="$event.stopPropagation(); deleteOffice(office.id, office.name)"
          ></button>

          <div class="card-body">

            <h5 class="card-title">
              {{ office.name }}
            </h5>

            <p class="card-text text-muted">
              {{ office.address }}
            </p>

            <span class="btn btn-outline-primary">
              Voir les salles
            </span>

          </div>

        </div>

      </div>

    }

  </div>

</div>
